name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 允许一次并发跑，取消旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（17 套件）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验版本号一致性
        run: npm run check:version

      # playwright-core 只是个驱动库，不自带浏览器。
      # 不装 chromium 的话，两个浏览器套件会被判「无浏览器」跳过并记为通过。
      - name: 安装 Chromium（浏览器套件要用）
        run: npx playwright install --with-deps chromium

      # 全部 17 个套件跑一次。
      # 以前这里先逐个 node 跑 8 个逻辑套件、再 npm test 跑一遍全部，
      # 同样的断言跑两遍、CI 时间翻倍。现在只保留 npm test。
      # 浏览器套件（含 GIF 编码器）靠下面安装的 chromium 真正执行，不再跳过。
      - name: 全量测试（17 套件）
        run: npm test

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-*.log
            logs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 打包静态站点
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本项目零构建 —— 「构建」就是把源码打成 zip，无需 node_modules
      # 注意：desktop/ 和 package-lock.json 必须一起打包。
      #   desktop/      —— 缺了它，README 里的 npm run desktop:build 必然失败
      #   package-lock.json —— 缺了它，用户 npm install 装不出可复现的依赖
      - name: 打包源码
        run: |
          mkdir -p dist
          cp -r index.html src scripts desktop desktop-electron package.json package-lock.json README.md .gitignore dist/
          cp run-tests.mjs test-*.mjs make-screenshots.mjs dist/
          mkdir -p dist/screenshots
          cp screenshots/*.png dist/screenshots/
          # 附上规划原文，方便别人对照实现
          cp 可视化编程动画制作软件_完整功能规划方案.md dist/ 2>/dev/null || true
          cd dist && zip -qr ../block-anim-factory-source.zip . && cd ..
          rm -rf dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: block-anim-factory-source
          path: block-anim-factory-source.zip
          retention-days: 30

  release:
    name: 发布发行版
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: block-anim-factory-source

      # 用 package.json 的版本号作为发行标签；该标签已存在说明这版发过了，跳过
      - name: 判断是否需要发版
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "标签 v${VERSION} 已存在，跳过发版"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "将发布 v${VERSION}"
          fi

      - name: 打标签
        if: steps.ver.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "发行 v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: 创建发行版
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 积木动画工厂 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: block-anim-factory-source.zip
          body: |
            ## 积木动画工厂 v${{ steps.ver.outputs.version }}

            用积木搭动画逻辑的可视化编程动画制作软件。零构建、零依赖纯前端，`npm start` 即可运行。

            ### 下载即用
            解压后需要一个静态服务器（ES Module 不能走 `file://`）：
            ```bash
            npm start          # → http://localhost:5173
            ```
            也可以用任意静态服务器指向解压目录。

            **桌面版（Windows / macOS）由 GitHub Actions 构建，并自动挂到本发行版**：
            - Windows 安装版 `*-setup.exe`、便携版 `*-win-x64.zip`（WPF 壳）
            - Windows / macOS Electron 产物（`.exe` / `.dmg` / `.zip`），同时提供 Linux 版本

            桌面版构建比网页版慢几分钟；如果暂时没看到对应产物，说明构建仍在进行，
            稍后刷新本页面即可。Electron 壳的安全测试在独立 workflow 中执行。

            **第一次打开会看到「Windows 已保护你的电脑」（SmartScreen）**：本项目开源、不做代码签名，
            这是正常的。点「更多信息」→「仍要运行」即可。安装包同理。

            ### 本次更新（v${{ steps.ver.outputs.version }}）

            - **运行时换成可恢复解释器**：不再每帧从头重放整棵脚本树。线程与帽子事件、控制流、
              变量与列表、运行时对象与克隆、z 顺序与父子关系、关键帧与补间都放进一份固定步长状态机；
              预览、MP4/GIF/PNG 序列导出与单帧 PNG 走同一入口，因此三条路径逐帧一致。
            - **积木库扩到 17 类 139 块**，P0/P1/P2 全量落地：事件与控制（作品开始 / 收到消息 /
              到达时间点 / 按下按键 / 被点击 / 作为克隆体启动，等待、等待直到、重复直到、停止、
              广播与广播并等待）、变量与列表、对象与运动（创建对象、滑行到、面向、边缘反弹、
              路径运动、公式运动、物理运动）、关键帧与补间（含自定义贝塞尔）、外观与滤镜、
              混合模式与遮罩、音效与节拍、克隆与列表驱动序列、粒子高级参数与简单物理。
            - **确定性有预算**：帧内步数上限 20000、线程上限 500、克隆上限 300，
              超限时本帧截断并给出提示，不会把界面卡死。
            - **浅色主题积木可读性**：积木文字颜色改按 WCAG 相对亮度从底色算出（选深/浅墨，
              不达标时小幅微调面色），不再按主题硬编码白字；浏览器测试直接量文字子元素的实际
              渲染色并覆盖 17 个分类，堵住「容器颜色正确、文字仍是灰的」这类漏检。
            - **工作台补齐**：播放速度 0.25×–4×、单步调试器面板、帽子积木外形、
              积木右键菜单与「⋯」更多参数入口。
            - **AI 目录与积木定义同源**：在线模型可生成的 89 个语句积木由积木定义推导，
              下拉取值与界面共用一份封闭菜单表，模型可直接回答「圆形」「正片叠底」这类中文取值。
            - 版本号升至 ${{ steps.ver.outputs.version }}，`check-version.mjs` 校验的四处版本保持一致。

            ### 本次包含
            - **统一 IR**：积木与节点视图共用一份数据，双向映射可验证无损
            - **逐帧一致**：预览、导出与单帧 PNG 共用同一份运行时，只差分辨率
            - **音频驱动**：录音、波形编辑、节拍检测、EBU R128 响度，画面跟着声音走
            - **字幕**：SRT / ASS / VTT 导入导出、双语、逐词高亮、爆字数告警
            - **场景树**：嵌套组、复用实例、混合模式与遮罩
            - **文字引擎**：可变字体、竖排、环形排版、路径文字、标点避头尾
            - **导出**：MP4（H.264）/ GIF / PNG 序列帧 / WebM
            - **数据驱动**：CSV/JSON 绑定变量，批量渲染 + 断点续渲
            - **模板市场**：版本历史、一键 Remix、付费分成、免版权素材库
            - **AI 辅助**：自然语言转积木、文案分镜、字幕对齐、动画反向解释
            - **版本协作**：提交历史、分支、三方合并

            ### 质量
            17 个测试套件全部通过：6 个官方模板 1062 帧逐帧绘制哈希与升级前基线一致
            （旧工程画面不变），另含真实 Chromium 驱动的端到端、像素级画面断言、
            积木对比度校验与 GIF 逐像素解码验证；Electron 壳的目录穿越、编码与 asar
            路径安全测试由独立 workflow 执行。

            ### 已知问题

            - **键盘 / 点击帽子不随导出成片生效**：导出的视频无法交互，`当按下按键` / `当被点击`
              只在预览播放中响应；其余帽子预览与导出一致。
            - **声音积木不进成片音轨**：`播放音效` / `设置音量` / `定时触发` 预览可听，
              导出只记录 cue，MP4/GIF 目前不做音频混流；成片配乐请用音频面板的配音轨。
            - **运行时对象与克隆体不写进工程文件**：`创建对象` / `克隆对象` 产生的对象每帧重建，
              保存与导出的工程里只有积木，图层面板看不到它们。
            - **旧工程的「粒子与重复器」参数可能不对**：「粒子与重复器」模板自首个公开版本起
              即为坏的（粒子不动、重复条没有高度），本版已修正模板本身。用旧版本模板保存过的
              工程需重新配置这两个积木的参数，后续版本提供自动迁移。
            - **积木嵌套过深时画面会停在当帧**：为防止界面卡死加了帧内步数上限，
              超限时本帧截断并弹出提示；简化嵌套后恢复。
            - **音频不随版本回滚**：音频轨道不作版本快照，回滚到旧版本时画面与字幕回退、音频保持当前状态。
            - 本项目刚开源，尚未经过真实使用验证。以上已知问题可能在日常使用中还会增加，
              欢迎到 Issues 反馈。