name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 允许一次并发跑，取消旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（12 套件 / 558 项纯逻辑断言）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # playwright-core 只是个驱动库，不自带浏览器。
      # 不装 chromium 的话，两个浏览器套件会被判「无浏览器」跳过并记为通过。
      - name: 安装 Chromium（浏览器套件要用）
        run: npx playwright install --with-deps chromium

      # 全部 12 个套件跑一次。
      # 以前这里先逐个 node 跑 8 个逻辑套件、再 npm test 跑一遍全部，
      # 同样的断言跑两遍、CI 时间翻倍。现在只保留 npm test。
      # 浏览器套件靠下面安装的 chromium 真正执行，不再跳过。
      - name: 全量测试（12 套件）
        run: npm test

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-*.log
            logs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 打包静态站点
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本项目零构建 —— 「构建」就是把源码打成 zip，无需 node_modules
      # 注意：desktop/ 和 package-lock.json 必须一起打包。
      #   desktop/      —— 缺了它，README 里的 npm run desktop:build 必然失败
      #   package-lock.json —— 缺了它，用户 npm install 装不出可复现的依赖
      - name: 打包源码
        run: |
          mkdir -p dist
          cp -r index.html src scripts desktop package.json package-lock.json README.md .gitignore dist/
          cp run-tests.mjs test-*.mjs make-screenshots.mjs dist/
          mkdir -p dist/screenshots
          cp screenshots/*.png dist/screenshots/
          # 附上规划原文，方便别人对照实现
          cp 可视化编程动画制作软件_完整功能规划方案.md dist/ 2>/dev/null || true
          cd dist && zip -qr ../block-anim-factory-source.zip . && cd ..
          rm -rf dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: block-anim-factory-source
          path: block-anim-factory-source.zip
          retention-days: 30

  release:
    name: 发布发行版
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: block-anim-factory-source

      # 用 package.json 的版本号作为发行标签；该标签已存在说明这版发过了，跳过
      - name: 判断是否需要发版
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "标签 v${VERSION} 已存在，跳过发版"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "将发布 v${VERSION}"
          fi

      - name: 打标签
        if: steps.ver.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "发行 v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: 创建发行版
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 积木动画工厂 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: block-anim-factory-source.zip
          body: |
            ## 积木动画工厂 v${{ steps.ver.outputs.version }}

            用积木搭动画逻辑的可视化编程动画制作软件。零构建、零依赖纯前端，`npm start` 即可运行。

            ### 下载即用
            解压后需要一个静态服务器（ES Module 不能走 `file://`）：
            ```bash
            npm start          # → http://localhost:5173
            ```
            也可以用任意静态服务器指向解压目录。

            **不想用命令行的话，可以在 Actions 页面手动触发「桌面版 EXE」workflow，
            在 `tag` 输入框填上本次的标签（例如 `v0.4.1`），构建完成后 EXE 会自动挂到这个发行版上。**
            桌面版需要 .NET 8 构建环境，所以比网页版慢几分钟；**桌面包不会自动出现，需要手动触发一次。**

            ### 本次修复（v0.4.1）

            导出的视频终于能用了：
            - MP4 导出一帧画面都没有（封装 entry_count 全为 0）
            - 导出的视频永远没有音轨
            - 60fps 导出实际只有 34fps、时间戳不均（现在 59.9fps）
            - 界面显示「ffmpeg 可用」，点导出直接报错（该路径从未实现）

            不再一用就崩：
            - 点响度归一、停止录音必崩
            - 关窗口提示「有未保存改动」形同虚设，1.6 秒后误判已保存，改动直接丢

            做出来的东西对了：
            - AI 说「从右滑入」，原来从左边进来（方向反了）
            - 「粒子与重复器」模板粒子原地不动、重复条高度为 0（该模板自首个版本起即为坏的）
            - 保存后重开工程，字幕消失
            - 多人合并时，对方改的标记点、变量、图层名被静默丢弃
            - 三层循环嵌套让界面卡死 27 秒（现在 38 毫秒）
            - 超 12 万行数据直接崩溃

            其它：
            - 24bit WAV 导入静默变全零
            - 音频频谱永远全零
            - ZIP 内中文文件名解压乱码
            - 任务失败后永久卡住不再重试

            ### 本次包含
            - **统一 IR**：积木与节点视图共用一份数据，双向映射可验证无损
            - **逐帧一致**：预览与导出走同一个 `render()`，只差分辨率
            - **音频驱动**：录音、波形编辑、节拍检测、EBU R128 响度，画面跟着声音走
            - **字幕**：SRT / ASS / VTT 导入导出、双语、逐词高亮、爆字数告警
            - **场景树**：嵌套组、复用实例、混合模式与遮罩
            - **文字引擎**：可变字体、竖排、环形排版、路径文字、标点避头尾
            - **导出**：MP4（H.264）/ GIF / PNG 序列帧 / WebM
            - **数据驱动**：CSV/JSON 绑定变量，批量渲染 + 断点续渲
            - **模板市场**：版本历史、一键 Remix、付费分成、免版权素材库
            - **AI 辅助**：自然语言转积木、文案分镜、字幕对齐、动画反向解释
            - **版本协作**：提交历史、分支、三方合并

            ### 质量
            12 个测试套件、558 项纯逻辑断言全部通过，另含真实 Chromium 驱动的端到端与像素级画面断言。

            ### 已知问题

            - **旧工程的「粒子与重复器」参数可能不对**：「粒子与重复器」模板自首个公开版本起
              即为坏的（粒子不动、重复条没有高度），本版已修正模板本身。用旧版本模板保存过的
              工程需重新配置这两个积木的参数，后续版本提供自动迁移。
            - **GIF 导出颜色偏色**：调色板大小与压缩码宽已修，但整体色差仍超标，根因排查中。
              PNG 序列帧与 MP4 不受影响。
            - **积木嵌套过深时画面会静默停住**：为防止界面卡死加了帧内步数上限，
              超限时本帧到此为止，界面暂无提示。
            - **音频不随版本回滚**：音频轨道不作版本快照，回滚到旧版本时画面与字幕回退、音频保持当前状态。
            - 本项目刚开源，尚未经过真实使用验证。以上已知问题可能在日常使用中还会增加，
              欢迎到 Issues 反馈。