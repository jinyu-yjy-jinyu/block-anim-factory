name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 允许一次并发跑，取消旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（13 套件）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验版本号一致性
        run: npm run check:version

      # playwright-core 只是个驱动库，不自带浏览器。
      # 不装 chromium 的话，两个浏览器套件会被判「无浏览器」跳过并记为通过。
      - name: 安装 Chromium（浏览器套件要用）
        run: npx playwright install --with-deps chromium

      # 全部 13 个套件跑一次。
      # 以前这里先逐个 node 跑 8 个逻辑套件、再 npm test 跑一遍全部，
      # 同样的断言跑两遍、CI 时间翻倍。现在只保留 npm test。
      # 浏览器套件（含 GIF 编码器）靠下面安装的 chromium 真正执行，不再跳过。
      - name: 全量测试（13 套件）
        run: npm test

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-*.log
            logs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 打包静态站点
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本项目零构建 —— 「构建」就是把源码打成 zip，无需 node_modules
      # 注意：desktop/ 和 package-lock.json 必须一起打包。
      #   desktop/      —— 缺了它，README 里的 npm run desktop:build 必然失败
      #   package-lock.json —— 缺了它，用户 npm install 装不出可复现的依赖
      - name: 打包源码
        run: |
          mkdir -p dist
          cp -r index.html src scripts desktop desktop-electron package.json package-lock.json README.md .gitignore dist/
          cp run-tests.mjs test-*.mjs make-screenshots.mjs dist/
          mkdir -p dist/screenshots
          cp screenshots/*.png dist/screenshots/
          # 附上规划原文，方便别人对照实现
          cp 可视化编程动画制作软件_完整功能规划方案.md dist/ 2>/dev/null || true
          cd dist && zip -qr ../block-anim-factory-source.zip . && cd ..
          rm -rf dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: block-anim-factory-source
          path: block-anim-factory-source.zip
          retention-days: 30

  release:
    name: 发布发行版
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: block-anim-factory-source

      # 用 package.json 的版本号作为发行标签；该标签已存在说明这版发过了，跳过
      - name: 判断是否需要发版
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "标签 v${VERSION} 已存在，跳过发版"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "将发布 v${VERSION}"
          fi

      - name: 打标签
        if: steps.ver.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "发行 v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: 创建发行版
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 积木动画工厂 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: block-anim-factory-source.zip
          body: |
            ## 积木动画工厂 v${{ steps.ver.outputs.version }}

            用积木搭动画逻辑的可视化编程动画制作软件。零构建、零依赖纯前端，`npm start` 即可运行。

            ### 下载即用
            解压后需要一个静态服务器（ES Module 不能走 `file://`）：
            ```bash
            npm start          # → http://localhost:5173
            ```
            也可以用任意静态服务器指向解压目录。

            **桌面版（Windows / macOS）由 GitHub Actions 构建，并自动挂到本发行版**：
            - Windows 安装版 `*-setup.exe`、便携版 `*-win-x64.zip`（WPF 壳）
            - Windows / macOS Electron 产物（`.exe` / `.dmg` / `.zip`），同时提供 Linux 版本

            桌面版构建比网页版慢几分钟；如果暂时没看到对应产物，说明构建仍在进行，
            稍后刷新本页面即可。Electron 壳的安全测试在独立 workflow 中执行。

            **第一次打开会看到「Windows 已保护你的电脑」（SmartScreen）**：本项目开源、不做代码签名，
            这是正常的。点「更多信息」→「仍要运行」即可。安装包同理。

            ### 本次修复（v0.4.3）

            - **GIF 导出偏色（根因修复）**：LZW 编码器的码宽提升提前了一个码，与 Chrome 等
              解码器错位，导致颜色通道整体偏移。修正后新增「Chrome 解码器逐像素验证」套件，
              调色板、多帧差分、循环扩展全部纳入回归。
            - **Electron 发行版资产污染**：中文产品名让产物名退化、上传通配符把 `app.asar`、
              `paks` 等内部文件一起挂上发行版。现在使用 ASCII 产物名，只上传安装包/压缩包，
              并等待网页版发行版创建后再挂载，不会产生空发行版。
            - **桌面版升级后仍加载旧页面**：WPF 壳的网页资源缓存只按程序版本命名，
              仅改 `src/` 的升级会继续使用旧资源。现在缓存键包含所有内嵌资源的内容哈希。
            - **桌面壳安全加固**：修复本地文件服务的路径前缀绕过；外部链接统一交给系统浏览器，
              窗口/页面不再被导航到任意站点；多显示器变化后窗口不会再恢复到屏幕外。
            - **版本合并/切分支不更新画布**：合并结果与分支最新版本现在会立即载入界面；
              修复合并时误删「仅本地新增」图层的问题。
            - **字幕生成动画未真正生效**：生成的积木现在会写入当前图层，标记点保留 id，
              时间轴与求值器可以正确识别。
            - **音频状态串工程**：新建/打开/载入版本/切换分支会清空上一份真实音轨；
              PNG 与批量渲染改用统一音源；区间导出的音轨按 `[起点, 终点]` 裁剪，不再音画错位。
            - **组可见性/不透明度不生效**：组的显示开关与透明度现在会向下传递给子图层并写入 IR。
            - **视频导出编码参数**：H.264/H.265 现在按分辨率与帧率自动选择编码级别，
              修复 1080p 固定使用 3.1 级别的问题；H.265 改用 `hvc1`/`hvcC` 封装；
              取消导出不会再掉进 ffmpeg 回退继续跑；GIF 帧延时按累计时间取整，
              30fps 不再快 10%、60fps 不再慢 20%，抖动默认关闭。
            - **字幕时间码**：逐词时间码改为按累计权重铺满，不再重叠/留缝；
              SRT/VTT/ASS 在 0.9996 等边界正确进位，不再输出 4 位毫秒。
            - **音频驱动时间轴**：非 60fps 工程按时间换算频段索引，不再整体压缩/拉伸。
            - 其它：修复工程校验在缺少 `markers` 时崩溃；版本面板「新建分支」按钮补上处理分支。
            - 版本号升至 0.4.3，`check-version.mjs` 校验的四处版本保持一致。

            ### 本次包含
            - **统一 IR**：积木与节点视图共用一份数据，双向映射可验证无损
            - **逐帧一致**：预览与导出走同一个 `render()`，只差分辨率
            - **音频驱动**：录音、波形编辑、节拍检测、EBU R128 响度，画面跟着声音走
            - **字幕**：SRT / ASS / VTT 导入导出、双语、逐词高亮、爆字数告警
            - **场景树**：嵌套组、复用实例、混合模式与遮罩
            - **文字引擎**：可变字体、竖排、环形排版、路径文字、标点避头尾
            - **导出**：MP4（H.264）/ GIF / PNG 序列帧 / WebM
            - **数据驱动**：CSV/JSON 绑定变量，批量渲染 + 断点续渲
            - **模板市场**：版本历史、一键 Remix、付费分成、免版权素材库
            - **AI 辅助**：自然语言转积木、文案分镜、字幕对齐、动画反向解释
            - **版本协作**：提交历史、分支、三方合并

            ### 质量
            13 个测试套件全部通过，另含真实 Chromium 驱动的端到端、像素级画面断言与
            GIF 逐像素解码验证；Electron 壳的目录穿越、编码与 asar 路径安全测试由独立 workflow 执行。

            ### 已知问题

            - **旧工程的「粒子与重复器」参数可能不对**：「粒子与重复器」模板自首个公开版本起
              即为坏的（粒子不动、重复条没有高度），本版已修正模板本身。用旧版本模板保存过的
              工程需重新配置这两个积木的参数，后续版本提供自动迁移。
            - **积木嵌套过深时画面会停在当帧**：为防止界面卡死加了帧内步数上限，
              超限时本帧截断并弹出提示；简化嵌套后恢复。
            - **音频不随版本回滚**：音频轨道不作版本快照，回滚到旧版本时画面与字幕回退、音频保持当前状态。
            - 本项目刚开源，尚未经过真实使用验证。以上已知问题可能在日常使用中还会增加，
              欢迎到 Issues 反馈。