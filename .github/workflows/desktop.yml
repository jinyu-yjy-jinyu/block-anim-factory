# ============================================================
#  Windows 桌面版（EXE）
# ------------------------------------------------------------
#  在 Windows runner 上构建 .NET 8 WPF + WebView2 壳，
#  把整个 Web 应用编进 exe。
#
#  为什么要单独一个 workflow：
#    - 只有 Windows runner 能构建 WPF
#    - EXE 有 130+ MB，不适合塞进「纯前端」那个包
#    - 用户想要的是「双击就能用」，那就是一个单独的下载项
# ============================================================

name: 桌面版 EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '把 EXE 挂到这个标签的发行版上（留空则只构建，不发布）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---- 逻辑测试：先确认 Web 应用本身是好的，再去打包 ----
      - name: 逻辑套件
        run: |
          node run-tests.mjs
          node test-audio.mjs
          node test-video.mjs
          node test-custom.mjs
          node test-scene.mjs
          node test-node-batch.mjs
          node test-v3v4.mjs
          node test-pipeline.mjs

      - name: 恢复 NuGet
        run: dotnet restore desktop/BlockAnim.csproj

      # ---- 冒烟测试：验证「资源打包 + 静态服务」这条链路 ----
      # 这个测试不开窗口，只断言内嵌资源能释放、HTTP 服务能正确响应。
      # 之前踩过的坑（%TEMP% 不可写、资源名映射错、404 吞成 HTML）都能被它抓住。
      - name: 构建（带冒烟测试）
        run: dotnet publish desktop/BlockAnim.csproj -c Release -o desktop/out

      - name: 运行桌面版冒烟测试
        shell: pwsh
        run: |
          $exe = Get-ChildItem '.\desktop\out\*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::没找到 exe'; exit 1 }
          Write-Host "运行 $($exe.Name) --smoke"

          # 让程序把结果写进 smoke-exit.txt，用文件判断成败。
          # 为什么不信退出码：WinExe 在 Start-Process -Wait 下经常拿不到
          # ExitCode（空字符串），拿它判断会把「全过」判成「失败」。
          # 程序会同时写两处（用户数据目录 + exe 旁），这里两个都查。
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'BlockAnimFactory\smoke-exit.txt'),
            (Join-Path $env:APPDATA      'BlockAnimFactory\smoke-exit.txt'),
            '.\desktop\out\smoke-exit.txt'
          )
          foreach ($f in $candidates) { if (Test-Path $f) { Remove-Item $f -Force } }

          # 必须 -Wait：直接 `& xxx.exe` 对 WinExe 不等待，
          # $LASTEXITCODE 也是空的，断言全过也会被判失败。
          $p = Start-Process -FilePath $exe.FullName `
                             -ArgumentList '--smoke' `
                             -NoNewWindow -Wait -PassThru

          Write-Host "进程退出码 = '$($p.ExitCode)'"

          $resultFile = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $resultFile) {
            Write-Host '::error::冒烟测试没有写结果文件，可能连 Main 都没跑到'
            exit 1
          }

          $fileCode = [int](Get-Content $resultFile -Raw).Trim()
          Write-Host "结果文件 = $resultFile（$fileCode）"
          if ($fileCode -ne 0) {
            Write-Host "::error::桌面版冒烟测试失败（退出码 $fileCode）"
            exit 1
          }
          Write-Host '冒烟测试通过'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 积木动画工厂-win-x64
          path: desktop/out/**
          retention-days: 30
          if-no-files-found: error

      - name: 清理冒烟测试留下的文件
        shell: pwsh
        run: |
          # smoke-exit.txt 是测试产物，不该跟着 exe 一起发给用户
          Get-ChildItem '.\desktop\out\smoke-exit.txt' -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Get-ChildItem '.\desktop\out\*.xml' -ErrorAction SilentlyContinue |
            Remove-Item -Force          # NuGet 包的 XML 文档，用户也用不上
          Get-ChildItem '.\desktop\out' | Select-Object Name

      - name: 打包 zip
        run: |
          Compress-Archive -Path desktop/out/* -DestinationPath block-anim-factory-win-x64.zip
          $size = [math]::Round((Get-Item block-anim-factory-win-x64.zip).Length / 1MB, 1)
          Write-Host "zip 大小: $size MB"

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: 积木动画工厂-Windows
          path: block-anim-factory-win-x64.zip
          retention-days: 30

  # ============================================================
  #  把 EXE 挂到同标签的发行版上
  # ------------------------------------------------------------
  #  为什么单独一个 job 而不是只靠 tag 触发：
  #    ci.yml 用 GITHUB_TOKEN 推 tag，而 GitHub 的规则是
  #    「用 GITHUB_TOKEN 产生的推送不会触发其它 workflow」。
  #    结果就是 tag 建出来了、网页版发行版也发了，唯独桌面版没跟上。
  #    所以这里改成：桌面版构建完，如果 PACKAGE_VERSION 这个标签
  #    已经有发行版，就把 exe 补挂上去；没有就跳过。
  # ============================================================
  attach:
    name: 挂到发行版
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 下载 zip
        uses: actions/download-artifact@v4
        with:
          name: 积木动画工厂-Windows
          path: dist

      - name: 挂到已有的发行版（没有就跳过）
        uses: softprops/action-gh-release@v2
        with:
          # 只指定 tag_name，不给 name/body：
          # 这样是「往已有发行版追加资源」，不会覆盖原有的说明文字。
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.zip
          make_latest: false

      - name: 说明（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: echo "已把桌面版 EXE 挂到 ${{ github.event.inputs.tag || '（需要先指定 tag）' }}"
