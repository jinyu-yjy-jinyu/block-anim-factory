# ============================================================
#  Windows 桌面版（EXE）
# ------------------------------------------------------------
#  在 Windows runner 上构建 .NET 8 WPF + WebView2 壳，
#  把整个 Web 应用编进 exe。
#
#  为什么要单独一个 workflow：
#    - 只有 Windows runner 能构建 WPF
#    - EXE 有 130+ MB，不适合塞进「纯前端」那个包
#    - 用户想要的是「双击就能用」，那就是一个单独的下载项
# ============================================================

name: 桌面版 EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '把 EXE 挂到这个标签的发行版上（留空则只构建，不发布）'
        required: false
        default: ''

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Windows EXE
    runs-on: windows-latest
    # .NET 冷构建 + 冒烟测试，给个上限。
    # 之前这个 job 没声明，exe 不自行退出就会挂到 GitHub 默认的 360 分钟。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验版本号一致性
        run: npm run check:version

      # ---- 逻辑测试：先确认 Web 应用本身是好的，再去打包 ----
      - name: 逻辑套件
        run: |
          node run-tests.mjs
          node test-audio.mjs
          node test-video.mjs
          node test-custom.mjs
          node test-scene.mjs
          node test-node-batch.mjs
          node test-v3v4.mjs
          node test-pipeline.mjs

      - name: 恢复 NuGet
        run: dotnet restore desktop/BlockAnim.csproj

      # ---- 冒烟测试：验证「资源打包 + 静态服务」这条链路 ----
      # 这个测试不开窗口，只断言内嵌资源能释放、HTTP 服务能正确响应。
      # 之前踩过的坑（%TEMP% 不可写、资源名映射错、404 吞成 HTML）都能被它抓住。
      - name: 构建（带冒烟测试）
        run: dotnet publish desktop/BlockAnim.csproj -c Release -o desktop/out

      - name: 运行桌面版冒烟测试
        shell: pwsh
        run: |
          $exe = Get-ChildItem '.\desktop\out\*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::没找到 exe'; exit 1 }
          Write-Host "运行 $($exe.Name) --smoke"

          # 让程序把结果写进 smoke-exit.txt，用文件判断成败。
          # 为什么不信退出码：WinExe 在 Start-Process -Wait 下经常拿不到
          # ExitCode（空字符串），拿它判断会把「全过」判成「失败」。
          # 程序会同时写两处（用户数据目录 + exe 旁），这里两个都查。
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'BlockAnimFactory\smoke-exit.txt'),
            (Join-Path $env:APPDATA      'BlockAnimFactory\smoke-exit.txt'),
            '.\desktop\out\smoke-exit.txt'
          )
          foreach ($f in $candidates) { if (Test-Path $f) { Remove-Item $f -Force } }

          # 必须 -Wait：直接 `& xxx.exe` 对 WinExe 不等待，
          # $LASTEXITCODE 也是空的，断言全过也会被判失败。
          #
          # 但 Start-Process -Wait 自己没有超时参数，exe 卡住就永远等下去。
          # 这里改成手动启动 + Wait-Process -Timeout，超时后强杀进程树。
          $timeoutSec = 120
          $proc = Start-Process -FilePath $exe.FullName `
                                 -ArgumentList '--smoke' `
                                 -NoNewWindow -PassThru
          try {
            Wait-Process -Id $proc.Id -Timeout $timeoutSec -ErrorAction Stop
          } catch {
            Write-Host "::error::冒烟测试超过 ${timeoutSec}s 未退出，强杀进程树"
            # taskkill /T 连子进程一起杀，避免留下占着 %TEMP% 的孤儿
            taskkill /PID $proc.Id /T /F 2>&1 | Out-Null
            exit 1
          }

          Write-Host "进程退出码 = '$($proc.ExitCode)'"

          $resultFile = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $resultFile) {
            Write-Host '::error::冒烟测试没有写结果文件，可能连 Main 都没跑到'
            exit 1
          }

          $fileCode = [int](Get-Content $resultFile -Raw).Trim()
          Write-Host "结果文件 = $resultFile（$fileCode）"
          if ($fileCode -ne 0) {
            Write-Host "::error::桌面版冒烟测试失败（退出码 $fileCode）"
            exit 1
          }
          Write-Host '冒烟测试通过'

      # 清理必须在「上传产物」之前。
      # 原来的顺序是先 upload 再清理，结果 artifact 里带着 smoke-exit.txt，
      # 只有后面那个 zip 是干净的 —— 同一个 job 产出两种质量的产物。
      - name: 清理冒烟测试留下的文件
        shell: pwsh
        run: |
          # smoke-exit.txt 是测试产物，不该跟着 exe 一起发给用户
          Get-ChildItem '.\desktop\out\smoke-exit.txt' -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Get-ChildItem '.\desktop\out\*.xml' -ErrorAction SilentlyContinue |
            Remove-Item -Force          # NuGet 包的 XML 文档，用户也用不上
          Write-Host '清理后 desktop/out 内容：'
          Get-ChildItem '.\desktop\out' | Select-Object Name

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          # 用 choco 而不是 jurplel/install-innosetup-action：
          #   runner 镜像自带 choco，静默安装可预期；
          #   第三方 action 的版本/兼容性我们控制不了。
          choco install innosetup -y --no-progress
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            # choco 装完通常在 PATH，但兜底找一下默认安装位置
            $cands = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\iscc.exe",
              "$env:ProgramFiles\Inno Setup 6\iscc.exe"
            )
            $hit = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hit) { Write-Host '::error::Inno Setup 安装后仍找不到 iscc'; exit 1 }
            Write-Host "iscc: $hit"
            # 放进 PATH 供下一步用（Add-Content 只在当前 job 有效）
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $hit -Parent)
          } else {
            Write-Host "iscc: $($iscc.Source)"
          }

      - name: 编译安装包
        shell: pwsh
        run: |
          # 纯打包层：只把 desktop/out 里已构建好的文件打成安装包，
          # 不重新编译、不碰任何 C# 代码。
          $src = 'desktop\installer.iss'
          if (-not (Test-Path $src)) { Write-Host "::error::缺少 $src"; exit 1 }
          iscc $src /Q
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::iscc 失败（$LASTEXITCODE）"; exit $LASTEXITCODE }
          $setup = Get-ChildItem 'block-anim-factory-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { Write-Host '::error::没生成安装包'; exit 1 }
          Write-Host "安装包: $($setup.Name)  $([math]::Round($setup.Length/1MB,1)) MB"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          # artifact 名与 path 都用 ASCII：中文 path 通配符会让 upload-artifact
          # 丢掉文件名前缀（实测过，产出一个以 "-" 开头的文件）。
          name: block-anim-factory-installer
          path: block-anim-factory-*-setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 积木动画工厂-win-x64
          path: desktop/out/**
          retention-days: 30
          if-no-files-found: error

      - name: 打包 zip
        run: |
          Compress-Archive -Path desktop/out/* -DestinationPath block-anim-factory-win-x64.zip
          $size = [math]::Round((Get-Item block-anim-factory-win-x64.zip).Length / 1MB, 1)
          Write-Host "zip 大小: $size MB"

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: 积木动画工厂-Windows
          path: block-anim-factory-win-x64.zip
          retention-days: 30

  # ============================================================
  #  把 EXE 挂到同标签的发行版上
  # ------------------------------------------------------------
  #  为什么单独一个 job 而不是只靠 tag 触发：
  #    ci.yml 用 GITHUB_TOKEN 推 tag，而 GitHub 的规则是
  #    「用 GITHUB_TOKEN 产生的推送不会触发其它 workflow」。
  #    结果就是 tag 建出来了、网页版发行版也发了，唯独桌面版没跟上。
  #    所以这里改成：桌面版构建完，如果 PACKAGE_VERSION 这个标签
  #    已经有发行版，就把 exe 补挂上去；没有就跳过。
  # ============================================================
  attach:
    name: 挂到发行版
    needs: build
    runs-on: ubuntu-latest
    # 只有「手动触发且填了 tag」才挂。
    # 以前写的是 `|| startsWith(github.ref, 'refs/tags/v')`，但 ci.yml 用
    # GITHUB_TOKEN 推的 tag 不会触发本 workflow，那半个分支永远走不到；
    # 而 workflow_dispatch 分支在不填 tag 时会拿 ref_name 回退成分支名 main，
    # 于是往一个叫 main 的 tag 上挂 —— 静默挂错地方。
    # 现在只认手动触发且输入非空的 tag，其余一律跳过。
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')

    # 写权限只给这个 job。build job 不需要写仓库。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 确定标签
        run: echo "TAG=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: 下载 zip
        uses: actions/download-artifact@v4
        with:
          name: 积木动画工厂-Windows
          path: dist

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: block-anim-factory-installer
          path: dist

      - name: 挂到已有的发行版（没有就跳过）
        uses: softprops/action-gh-release@v2
        with:
          # 只指定 tag_name，不给 name/body：
          # 这样是「往已有发行版追加资源」，不会覆盖原有的说明文字。
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || env.TAG }}
          # zip（便携版）与 setup.exe（安装版）都挂。
          # 两种都保留：有人想解压即用，有人要开始菜单/卸载入口。
          files: |
            dist/*.zip
            dist/*-setup.exe
          make_latest: false

      - name: 说明
        run: |
          echo "已把桌面版（zip + 安装包）挂到 ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || env.TAG }}"
          echo "注意：安装包未做代码签名，首次运行会触发 SmartScreen。"
